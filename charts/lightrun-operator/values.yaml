## Deployment configuration
controllerManager:
  replicas: 1

  ## Controller image
  manager:
    image:
      repository: lightruncom/lightrun-k8s-operator
      # -- For simplicity of version compatibilities we are keeping the same controller and chart versions
      # So the most safe approach is to use same version as the Chart.
      # When installing chart from the helm repo, every helm package version will have controller image set to chart version
      tag: latest
      # -- The pull secrets to use for operator deployment.
      pullSecrets: []
      ## If you want to set image pull secrets for operator deployment, delete the `[]` in the line above
      ## and uncomment this example block
      # - name: "dockerhub-credentials-secret-name"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi

    ################
    ## Node selection
    ################
    tolerations: []
    ## If you want to set tolerations for operator deployment, delete the `[]` in the line above
    ## and uncomment this example block
    # - key: "purpose"
    #   operator: "Exists"
    #   effect: "NoSchedule"

    nodeSelector: {}
    #   purpose: stage
    ## If you want to set node selector for operator deployment, delete the `{}` in the line above
    ## and uncomment this example block
    # label-key1: "label-value1"
    # label-key2: "label-value2"

  ## PodDisruptionBudget ensures a minimum number of operator pods remain available during voluntary disruptions.
  ## Recommended when running more than 1 replica for HA.
  podDisruptionBudget:
    # -- Set to true to create a PodDisruptionBudget for the controller manager.
    # Disabled by default to preserve backwards compatibility.
    enabled: false
    # -- minAvailable: minimum number (or percentage) of pods that must remain available.
    # Mutually exclusive with maxUnavailable. Set one or the other, not both.
    # Examples: 1  or  "50%"
    minAvailable: ~
    # -- maxUnavailable: maximum number (or percentage) of pods that can be unavailable.
    # Mutually exclusive with minAvailable. Set one or the other, not both.
    # Examples: 1  or  "50%"
    maxUnavailable: ~
    ## Example for a 3-replica HA setup — keep at least 2 pods up at all times:
    # minAvailable: 2

## Controller configuration
managerConfig:
  # -- Log level: 1 - 5
  # Higher number - more logs
  # Documentation of logr module https://pkg.go.dev/github.com/go-logr/logr@v1.2.0#hdr-Verbosity
  # On level info (0) (default) you'll see only deployments that are being added or deleted and errors
  # On level 1 you'll see 1 additional log per every successful reconciliation loop run
  # On level 2 you'll see all debug prints with intermediate steps while patching deployment per every reconciliation loop run
  logLevel: info

  ## Default values of the container inside pod. In most cases you don't need to change those
  healthProbe:
    bindAddress: ":8081"
  metrics:
    bindAddress: ":8080"
    # -- Profiler is used for debugging and performance analysis
    # It is disabled by default
    # To enable it, specify the bindAddress, similar to the metrics or the health probes
    # Make sure to protect this endpoint as it is containing sensitive information
  profiler:
    bindAddress: ""
  # -- Operator may work in 2 scopes: cluster and namespaced
  # Cluster scope will give permissions to operator to watch and patch deployment in the whole cluster
  # With namespaced scope you need to provide list of namespaces that operator will be able to watch.
  # Namespaced scope implemented by both controller code and creation of the appropriate Roles by the chart
  # Any change to the list of namespaces will cause restart of the operator controller pod.
  operatorScope:
    namespaces:
      - default
    namespacedScope: false

# -- Pod-mutating admission webhook that injects the Lightrun Java agent into annotated Pods,
# replacing the CR/controller-based patching mechanism. Additive today: the old CRD/controller
# keep running side by side until the webhook path is validated end-to-end.
webhook:
  # -- Set to true to enable the mutating webhook, its Service, and (if webhook.certManager.enabled)
  # the cert-manager Issuer/Certificate used for its TLS serving cert.
  enabled: false
  # -- Port the webhook server listens on inside the manager container.
  port: 9443
  # -- Directory the webhook server reads its TLS serving cert (tls.crt/tls.key) from.
  certDir: /tmp/k8s-webhook-server/serving-certs
  # -- Admission FailurePolicy for the Pod mutating webhook. "Ignore" means webhook unavailability
  # must not block Pod scheduling; "Fail" would block all Pod creates cluster-wide if the webhook
  # is down, which is generally too risky for a cluster-wide Pod webhook.
  failurePolicy: Ignore
  certManager:
    # -- Use cert-manager (selfSigned Issuer + Certificate) to bootstrap the webhook's TLS serving
    # cert. Requires cert-manager to be installed in the cluster. If false, you must set
    # webhook.certSecretName to a Secret you provision yourself (tls.crt/tls.key) and
    # webhook.caBundle to its PEM-encoded CA bundle.
    enabled: true
  # -- Name of a pre-existing Secret (tls.crt/tls.key) to use as the webhook's serving cert when
  # webhook.certManager.enabled is false. Ignored otherwise.
  certSecretName: ""
  # -- PEM-encoded CA bundle used to verify the webhook's serving cert when
  # webhook.certManager.enabled is false. Ignored otherwise (cert-manager injects the CA bundle
  # via the cert-manager.io/inject-ca-from annotation instead).
  caBundle: ""
  # -- Defaults for the Java agent injection mechanics; mirrors the old LightrunJavaAgent CR's
  # initContainer/sharedVolume fields, now operator-wide instead of per-CR.
  injection:
    sharedVolumeName: lightrun-agent
    sharedVolumeMountPath: /lightrun
    initContainerImage:
      repository: lightruncom/k8s-operator-init-java-agent-linux
      tag: latest
      # -- Empty uses the cluster default image pull policy.
      pullPolicy: ""

# -- Metrics service for prometheus compatible poller
metricsService:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  type: ClusterIP

## Comment out if you want to use Release name as prefix to the resource naming
nameOverride: lightrun-k8s-operator
