apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-controller-manager
  labels:
  {{- include "chart.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-controller-manager
  labels:
    control-plane: controller-manager
  {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controllerManager.replicas }}
  selector:
    matchLabels:
      control-plane: controller-manager
    {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        control-plane: controller-manager
      {{- include "chart.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      containers:
      - args:
        - --health-probe-bind-address={{ .Values.managerConfig.healthProbe.bindAddress }}
        - --metrics-bind-address={{ .Values.managerConfig.metrics.bindAddress }}
        - --leader-elect
        - --zap-log-level={{ .Values.managerConfig.logLevel }}
        {{- if .Values.managerConfig.profiler.bindAddress }}
        - --pprof-bind-address={{ .Values.managerConfig.profiler.bindAddress }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - --webhook-enabled=true
        - --webhook-port={{ .Values.webhook.port }}
        - --webhook-cert-dir={{ .Values.webhook.certDir }}
        - --webhook-shared-volume-name={{ .Values.webhook.injection.sharedVolumeName }}
        - --webhook-shared-volume-mount-path={{ .Values.webhook.injection.sharedVolumeMountPath }}
        - --webhook-init-container-image={{ .Values.webhook.injection.initContainerImage.repository }}:{{ .Values.webhook.injection.initContainerImage.tag }}
        {{- if .Values.webhook.injection.initContainerImage.pullPolicy }}
        - --webhook-init-container-image-pull-policy={{ .Values.webhook.injection.initContainerImage.pullPolicy }}
        {{- end }}
        - --webhook-namespace={{ .Release.Namespace }}
        - --webhook-service-name={{ include "chart.fullname" . }}-webhook-service
        - --webhook-cert-secret-name={{ include "chart.fullname" . }}-webhook-server-cert
        - --webhook-mutating-webhook-configuration-name={{ include "chart.fullname" . }}-mutating-webhook-configuration
        {{- end }}
        command:
        - /manager
        image: {{ .Values.controllerManager.manager.image.repository }}:{{ .Values.controllerManager.manager.image.tag | default .Chart.AppVersion }}
        {{- if .Values.managerConfig.operatorScope.namespacedScope }}
        env:
        - name: WATCH_NAMESPACE
          value: {{ range .Values.managerConfig.operatorScope.namespaces  }}{{ . }},{{ end }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        ports:
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {{- toYaml .Values.controllerManager.manager.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
        {{- if .Values.webhook.enabled }}
        volumeMounts:
        - mountPath: {{ .Values.webhook.certDir }}
          name: webhook-cert
          readOnly: true
        {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: #require kube version 1.19+
          type: RuntimeDefault
      serviceAccountName: {{ include "chart.fullname" . }}-controller-manager
      {{- with .Values.controllerManager.manager.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      {{- if .Values.controllerManager.manager.tolerations }}
      tolerations:
{{ toYaml .Values.controllerManager.manager.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.controllerManager.manager.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.controllerManager.manager.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
      - name: webhook-cert
        secret:
          defaultMode: 420
          secretName: {{ include "chart.fullname" . }}-webhook-server-cert
      {{- end }}
