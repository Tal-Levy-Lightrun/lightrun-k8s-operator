{{- if .Values.webhook.enabled }}
# Placeholder Secret the operator's own cert-controller-based CertRotator (cmd/main.go,
# github.com/open-policy-agent/cert-controller) populates with a self-signed CA + serving cert
# at startup and keeps rotated -- no cert-manager or other external prerequisite needed. It must
# already exist (even empty) before the manager starts: the rotator only ever Gets/Updates this
# Secret, it never Creates it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-webhook-server-cert
  labels:
  {{- include "chart.labels" . | nindent 4 }}
{{- end }}
