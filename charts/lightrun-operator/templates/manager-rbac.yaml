{{- if not .Values.managerConfig.operatorScope.namespacedScope }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-manager-role-rw
  labels:
  {{- include "chart.labels" . | nindent 4 }}
# Namespaced-resource rules only -- the always-cluster-scoped rules (Namespace,
# MutatingWebhookConfiguration, ClusterAgentPool, and Secrets -- see manager-rbac-cluster.yaml's
# comment for why Secrets lives there too) live in the always-rendered ClusterRole in
# manager-rbac-cluster.yaml instead, so they're granted exactly once regardless of
# operatorScope.namespacedScope rather than duplicated across two ClusterRoles here.
rules:
  {{- .Files.Get "generated/rbac_manager_rules_namespaced.yaml" | nindent 2}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-manager-rolebinding-rw
  labels:
  {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "chart.fullname" . }}-manager-role-rw'
subjects:
- kind: ServiceAccount
  name: '{{ include "chart.fullname" . }}-controller-manager'
  namespace: '{{ .Release.Namespace }}'
{{- end }}
