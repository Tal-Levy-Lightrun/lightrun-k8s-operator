{{- if .Values.managerConfig.operatorScope.namespacedScope }}
{{ range .Values.managerConfig.operatorScope.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" $ }}-manager-role
  labels:
  {{- include "chart.labels" $ | nindent 4 }}
  namespace: {{ . }}
# Namespaced-resource rules only -- a namespaced Role can never grant access to cluster-scoped
# resources (Namespace, MutatingWebhookConfiguration, ClusterAgentPool), and Secrets access is
# deliberately kept out of this per-namespace Role too even though Secret itself is namespaced --
# see manager-rbac-cluster.yaml's comment for why. All of those instead live in the
# always-cluster-scoped ClusterRole in manager-rbac-cluster.yaml, rendered regardless of
# operatorScope.namespacedScope.
rules:
  {{- $.Files.Get "generated/rbac_manager_rules_namespaced.yaml" | nindent 2}}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" $ }}-manager-rolebinding
  labels:
  {{- include "chart.labels" $ | nindent 4 }}
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ include "chart.fullname" $ }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "chart.fullname" $ }}-controller-manager'
  namespace: '{{ $.Release.Namespace }}'
{{- end }}

{{- end }}