{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "chart.fullname" . }}-mutating-webhook-configuration
  labels:
  {{- include "chart.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "chart.fullname" . }}-serving-cert
  {{- end }}
webhooks:
  # Intercepts every Pod create cluster-wide: the annotation-driven contract (lightrun.com/agent-type
  # etc.) can't be expressed via this webhook's own object/namespace selectors, so the handler itself
  # no-ops for Pods that don't carry a recognized lightrun.com/agent-type annotation.
  - name: mpod.lightrun.com
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ include "chart.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate--v1-pod
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled is false" .Values.webhook.caBundle | quote }}
      {{- end }}
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
{{- end }}
