# Adds namespace to all resources.
namespace: lightrun-k8s-operator

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: lightrun-k8s-operator-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
  - ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus

patches:
  - path: manager_webhook_patch.yaml
  - path: webhookcainjection_patch.yaml

# The following vars let kustomize substitute the cert-manager Certificate's namespace/name
# into the MutatingWebhookConfiguration's cert-manager.io/inject-ca-from annotation, and the
# webhook Service's namespace/name into the Certificate's dnsNames.
vars:
  - name: CERTIFICATE_NAMESPACE
    objref:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
    fieldref:
      fieldpath: metadata.namespace
  - name: CERTIFICATE_NAME
    objref:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
  - name: SERVICE_NAMESPACE
    objref:
      kind: Service
      version: v1
      name: webhook-service
    fieldref:
      fieldpath: metadata.namespace
  - name: SERVICE_NAME
    objref:
      kind: Service
      version: v1
      name: webhook-service

